<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraDoc OCR Local</title><link rel="stylesheet" href="/static/app.css"></head><body>
<main><header><p class="eyebrow">LOCAL OCR WORKSPACE</p><h1>AuraDoc OCR</h1><p>PDF 教材排版還原與原始 OCR 對照</p></header>
<section class="grid"><form id="job-form" class="card" aria-label="建立 OCR 工作"><h2>建立工作</h2><label>PDF 檔案<input id="file" name="file" type="file" accept="application/pdf" required></label><p id="hardware" class="muted" role="status">正在讀取本機硬體資訊…</p><details class="hardware-details"><summary>執行 provider 詳情</summary><pre id="provider-details"></pre></details><p id="file-info" class="muted" role="status">選擇 PDF 後會驗證頁數。</p>
<fieldset><legend>處理範圍</legend><label><input type="radio" name="range_mode" value="first5" checked> 前 5 頁</label><label><input type="radio" name="range_mode" value="all"> 全書</label><label><input type="radio" name="range_mode" value="custom"> 自訂</label><div class="range"><label>起頁<input name="start_page" type="number" min="1" value="1"></label><label>迄頁<input name="end_page" type="number" min="1" value="5"></label></div></fieldset>
<fieldset><legend>運算裝置</legend><label><input type="radio" name="backend" value="auto" checked> Auto（GPU 失敗時改用 CPU）</label><label><input type="radio" name="backend" value="gpu"> GPU（失敗即回報）</label><label><input type="radio" name="backend" value="cpu"> CPU</label></fieldset>
<details><summary>進階設定</summary><label><input name="adaptive_retry" type="checkbox" checked> 低信心 DPI 重試</label><label><input name="clahe" type="checkbox" checked> CLAHE 對比增強</label><label><input name="reflow" type="checkbox" checked> 句子重組</label><label><input name="two_column" type="checkbox" checked> 雙欄偵測</label><label><input name="furigana" type="checkbox" checked> 振假名降噪</label><label><input name="homoglyphs" type="checkbox" checked> 同形字校正</label></details>
<button type="submit">排入 OCR 佇列</button></form>
<section class="card result" aria-live="polite"><div class="result-head"><div><p class="eyebrow">工作狀態</p><h2 id="title">尚未建立工作</h2></div><button id="cancel" class="secondary" disabled>取消工作</button></div><p id="status">上傳 PDF 後，會建立可在重整頁面後查詢的 UUID 工作紀錄。</p><progress id="progress" max="100" value="0">0%</progress><p id="telemetry" class="muted">實際 OCR provider 將在處理完成後顯示。</p><div class="downloads" id="downloads" hidden><a data-kind="clean">下載 Clean Markdown</a><a data-kind="raw">下載 Raw Text</a><a data-kind="metrics">下載 Metrics JSON</a></div></section></section>
<section id="history" class="card" aria-label="最近工作"><h2>最近工作</h2><div id="history-list" class="history-list"></div></section><section id="compare" class="compare" hidden><div class="page-nav"><button id="prev-page" class="secondary">上一頁</button><span id="page-label">第 1 頁</span><button id="next-page" class="secondary">下一頁</button></div><article class="card"><h2>原 PDF 頁面</h2><img id="original" alt="原始 PDF 頁面預覽"></article><article class="card"><h2>Clean Markdown</h2><pre id="clean"></pre></article><article class="card"><h2>Raw OCR</h2><pre id="raw"></pre></article></section></main><script src="/static/app.js"></script></body></html>
